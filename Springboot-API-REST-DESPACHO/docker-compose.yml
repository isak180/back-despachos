version: "3.9"

services:
  # ─────────────────────────────────────────
  # Base de datos MySQL
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: despachos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-despachos_db}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "3306:3306"
    # Named volume: los datos persisten aunque el contenedor se elimine
    volumes:
      - despachos-db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Backend Spring Boot - Despachos
  # ─────────────────────────────────────────
  backend-despachos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-despachos
    image: backend-despachos:latest
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-despachos_db}
      DB_USER: ${MYSQL_USER:-appuser}
      DB_PASS: ${MYSQL_PASSWORD:-apppassword}
      SERVER_PORT: 8080
      # CORS: URL del frontend
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

# ─────────────────────────────────────────
# Named Volumes (persistencia de datos)
# Justificación: se usa named volume en lugar de bind mount porque
# es gestionado por Docker, portable entre entornos y no depende
# de la ruta del host. Ideal para bases de datos en producción.
# ─────────────────────────────────────────
volumes:
  despachos-db-data:
    driver: local

networks:
  backend-net:
    driver: bridge
